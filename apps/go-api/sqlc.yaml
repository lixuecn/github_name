version: "2"
sql:
  - engine: postgresql
    # Prisma owns the schema: sqlc reads its migrations and never writes DDL.
    # Add each new migration.sql here when the Prisma schema changes.
    schema:
      - ../../packages/db/prisma/migrations/20261108120000_github_profile/migration.sql
    queries: internal/store/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: pg_catalog.timestamp
            go_type: time.Time
          - db_type: pg_catalog.timestamp
            nullable: true
            go_type:
              type: time.Time
              pointer: true
