name: Go API CI

# test: vet + tests (including DB integration tests against a Postgres
#       service) on PRs and pushes.
# image: on pushes to the branches below, build the linux/arm64 image and
#       push it to ECR tagged with the commit SHA.
#
# The image job is the interim path while CodeBuild (apps/infra,
# GoApiImageStack) has no build quota: it authenticates as the IAM user
# go-api-github-ecr-push, which can only push/pull the go-api repository.
# Required repository settings:
#   secrets   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY  (that user's access key)
#   variables AWS_REGION                                 (ap-southeast-2)
# Once CodeBuild works, delete this job, the secrets and the IAM user
# (cdk.json: githubActionsPushUser=false).

on:
  push:
    # feat/go-api is temporary: lets the first image be built before merging.
    branches: [main, feat/go-api]
    paths:
      - apps/go-api/**
      - packages/db/prisma/migrations/**
      - .github/workflows/go-api-ci.yml
  pull_request:
    paths:
      - apps/go-api/**
      - packages/db/prisma/migrations/**
      - .github/workflows/go-api-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-api-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ECR_REPOSITORY: go-api
  IMAGE_PLATFORM: linux/arm64

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/go-api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/go-api/go.mod
          cache-dependency-path: apps/go-api/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...
        env:
          GO_API_TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  image:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check repository settings
        env:
          HAS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          test -n "$AWS_REGION" || { echo "Set the AWS_REGION repository variable"; exit 1; }
          test "$HAS_KEY" = "true" || { echo "Set the AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY repository secrets"; exit 1; }

      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tags are immutable: a re-run for the same commit must not push again.
      - name: Check for an existing image
        id: existing
        run: |
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$IMAGE_TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v4
        if: steps.existing.outputs.exists != 'true'

      # The Dockerfile cross-compiles on the build platform, so an amd64 runner
      # produces the arm64 image without emulation.
      - name: Build and push
        if: steps.existing.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: apps/go-api
          platforms: ${{ env.IMAGE_PLATFORM }}
          push: true
          # A single image manifest (no attestation index), so the ECR rule
          # that expires untagged images cannot delete parts of a live image.
          provenance: false
          sbom: false
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=go-api
          cache-to: type=gha,scope=go-api,mode=max

      - name: Summary
        run: |
          image="${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY:$IMAGE_TAG"
          if [ "${{ steps.existing.outputs.exists }}" = "true" ]; then
            echo "Image already in ECR, skipped push: \`$image\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pushed \`$image\` ($IMAGE_PLATFORM)" >> "$GITHUB_STEP_SUMMARY"
          fi
